spring.application.name=criptografia

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cryptography Keys from Environment Variables
# For local testing, providing defaults. In production, these must be set via env vars.
crypto.aes.key=${AES_KEY:my-secret-aes-key-for-testing}
crypto.rsa.public-key=${RSA_PUBLIC_KEY:}
crypto.rsa.private-key=${RSA_PRIVATE_KEY:}
